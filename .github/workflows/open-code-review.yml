name: Open Code Review (advisory)

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Advisory Open Code Review
        uses: alibaba/open-code-review@6e5cd8cf2578768b6c6d1fafa1d14f66801d5f2b
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          llm_url: ${{ secrets.OCR_LLM_URL }}
          llm_auth_token: ${{ secrets.OCR_LLM_AUTH_TOKEN }}
          llm_model: ${{ vars.OCR_LLM_MODEL }}
          background: "Quincestone review policy: authentication and authorization boundaries, safe redirects, no service-role exposure, IDOR prevention, no fake commerce data, and strict separation of Account, Business, and Admin authority."
          incremental: true
          sticky_summary: true
          upload_artifacts: true
