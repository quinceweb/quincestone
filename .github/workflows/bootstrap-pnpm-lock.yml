name: Bootstrap pnpm lockfile

on:
  push:
    branches:
      - feat/quincestone-monorepo-app-foundation
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lockfile:
    if: ${{ !hashFiles('pnpm-lock.yaml') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Generate authoritative lockfile
        run: pnpm install --lockfile-only

      - name: Commit lockfile
        run: |
          if git diff --quiet -- pnpm-lock.yaml && git ls-files --error-unmatch pnpm-lock.yaml >/dev/null 2>&1; then
            echo "pnpm-lock.yaml already tracked; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git commit -m "chore: add authoritative pnpm workspace lockfile"
          git push
