name: Optional Web Preview to GitHub Pages

# quincestone.com is deployed by Vercel from apps/web (Vite).
# This workflow is an optional, manually-triggered GitHub Pages preview only.
# It must not be interpreted as the production deployment pipeline.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "optional-web-pages-preview"
  cancel-in-progress: true

jobs:
  build-preview:
    name: Build Vite preview
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
          run_install: false
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run canonical Web quality gate
        run: pnpm --filter @quincestone/web check
      - name: Build Pages preview with relative asset base
        run: pnpm --filter @quincestone/web exec vite build --base=./
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload preview artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist

  deploy-preview:
    name: Deploy optional Pages preview
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build-preview
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
